[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsdock"
version = "0.1.0"
description = "AgentsDock is a governed multi-agent task platform for teams."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0",
  "httpx>=0.24.1",
  "pydantic>=2.0.3",
  "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]
documents = [
  "pypdf>=5.0.0,<7",
]
postgres = [
  "psycopg[binary]>=3.2.0,<4",
  "SQLAlchemy>=2.0.0,<3",
]
platform = [
  "pypdf>=5.0.0,<7",
  "psycopg[binary]>=3.2.0,<4",
  "SQLAlchemy>=2.0.0,<3",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_contract"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9"]
