name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_POSTGRES_URL: postgresql://agent_platform:agent_platform_test@localhost:5432/agent_platform_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agent_platform_test
          POSTGRES_USER: agent_platform
          POSTGRES_PASSWORD: agent_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_platform -d agent_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: gateway/go.sum
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,platform]"

      - name: Lint Python
        run: python -m ruff check .

      - name: Compile Python
        run: python -m compileall -q app scripts tests tests_contract

      - name: Check frontend syntax
        run: node --check app/static/app.js

      - name: Validate migrations
        run: python -m scripts.postgres_migrate --validate-only

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-fail-under=70 --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Check Gateway formatting
        working-directory: gateway
        run: test -z "$(gofmt -l .)"

      - name: Vet Gateway
        working-directory: gateway
        run: go vet ./...

      - name: Test Gateway with race detector and coverage
        working-directory: gateway
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce Go coverage baseline
        working-directory: gateway
        run: |
          go tool cover -func=coverage.out |
            awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 15) exit 1 }'

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: gateway/coverage.out
          if-no-files-found: warn
